<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HexMinefield 3D</title>
  <meta name="description" content="HexMinefield 3D is a Minesweeper puzzle played on a rotating 3D sphere. Available on Google Play.">
  <link rel="canonical" href="https://tuyaupipe.github.io/hexminefield-3d/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="HexMinefield 3D">
  <meta property="og:description" content="Minesweeper on a rotating 3D sphere.">
  <meta property="og:url" content="https://tuyaupipe.github.io/hexminefield-3d/">
  <meta property="og:image" content="https://play-lh.googleusercontent.com/_BXR6UXMUGIzwuevpNDLkEYexwUKTIgVZP0QKhZLO9ah-aqbSL02WxefwvbbqJAq9dWQol6YrahFsV5PJ4by3d8=w1052-h592-rw">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070a12;
      color: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 78% 42%, #18345d 0, #0c172c 24%, transparent 48%),
        #070a12;
    }
    a { color: inherit; }
    .shell { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
    header { padding: 24px 0; }
    header a { color: #aeb8c9; font-weight: 700; text-decoration: none; }
    main {
      min-height: calc(100vh - 150px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 390px);
      align-items: center;
      gap: clamp(32px, 7vw, 88px);
      padding: 36px 0 64px;
    }
    .identity { display: flex; align-items: center; gap: 18px; }
    .icon {
      width: 92px;
      height: 92px;
      border-radius: 23px;
      box-shadow: 0 18px 45px #0008;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7vw, 4.8rem);
      line-height: .98;
      letter-spacing: -.055em;
    }
    .tagline {
      margin: 28px 0 24px;
      color: #bdc7d8;
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    }
    .play-link { display: inline-block; line-height: 0; }
    .play-link img { width: 210px; height: auto; }
    .game-shot {
      display: block;
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
      border: 1px solid #ffffff20;
      border-radius: 30px;
      box-shadow: 0 28px 70px #000a;
    }
    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      padding: 24px 0 32px;
      color: #7f8a9d;
      font-size: .88rem;
    }
    footer a { text-decoration: none; }
    footer a:hover, header a:hover { color: #fff; }
    @media (max-width: 720px) {
      body { background: radial-gradient(circle at 50% 65%, #18345d 0, transparent 40%), #070a12; }
      main { grid-template-columns: 1fr; text-align: center; }
      .identity { justify-content: center; flex-direction: column; }
      .game-shot { width: min(330px, 86vw); margin: 10px auto 0; max-height: none; }
      footer { justify-content: center; }
    }
  </style>
</head>
<body>
  <header class="shell">
    <a href="/">Pipe Studio</a>
  </header>

  <main class="shell">
    <div>
      <div class="identity">
        <img class="icon" src="https://play-lh.googleusercontent.com/3qFMa3DB89EyzK6GprOHAvjzp_l1FDKBYzEt03x7XHLTsAGm2H-JRpIP1quInw71nxXBfBIpG9g3b5ReNLH22w=w480-h960-rw" alt="HexMinefield 3D icon">
        <h1>HexMinefield<br>3D</h1>
      </div>
      <p class="tagline">Minesweeper on a rotating 3D sphere.</p>
      <a class="play-link" href="https://play.google.com/store/apps/details?id=net.pipestudio.hexminefield3d" aria-label="Get HexMinefield 3D on Google Play">
        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play">
      </a>
    </div>

    <a href="https://play.google.com/store/apps/details?id=net.pipestudio.hexminefield3d" aria-label="Open HexMinefield 3D on Google Play">
      <img class="game-shot" src="https://play-lh.googleusercontent.com/_BXR6UXMUGIzwuevpNDLkEYexwUKTIgVZP0QKhZLO9ah-aqbSL02WxefwvbbqJAq9dWQol6YrahFsV5PJ4by3d8=w1052-h592-rw" alt="HexMinefield 3D gameplay">
    </a>
  </main>

  <footer class="shell">
    <a href="/hexminefield-3d/support/">Support</a>
    <a href="/hexminefield-3d/privacy-policy/">Privacy Policy</a>
    <a href="/hexminefield-3d/privacy-choices/">Privacy Choices</a>
  </footer>
</body>
</html>
